# render.yaml — Render Blueprint for one-click deployment
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: connect your GitHub repo on render.com and Render auto-detects this file.

services:
  # ── Backend (Node.js/Express) ─────────────────────────────────────────────────
  - type: web
    name: flowdesk-backend
    runtime: node
    region: singapore   # change to 'oregon' or 'frankfurt' as needed
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: ADMIN_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false                # You set this manually in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false                # Set to your frontend URL after deploy
      - key: ESCALATION_REPLY_THRESHOLD
        value: "5"
      - key: PORT
        value: "5001"

  # ── Frontend (Next.js — static export on Render Static Site) ──────────────────
  # Uncomment this block to also deploy the frontend on Render.
  # Alternatively, deploy frontend to Vercel for better performance.
  #
  # - type: web
  #   name: flowdesk-frontend
  #   runtime: node
  #   rootDir: frontend
  #   buildCommand: npm install && npm run build
  #   startCommand: npm run start
  #   envVars:
  #     - key: NEXT_PUBLIC_API_URL
  #       fromService:
  #         name: flowdesk-backend
  #         type: web
  #         property: host
  #         envVarKey: RENDER_EXTERNAL_URL

databases:
  # ── PostgreSQL (managed by Render) ────────────────────────────────────────────
  - name: flowdesk-db
    region: singapore
    plan: free              # upgrade to 'starter' for production persistence
    databaseName: flowdesk_prod
    user: flowdesk_master
